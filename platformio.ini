; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; builds using ~/.platformio/penv/bin/platformio run
;

[platformio]
description = HD2 Macropad ESP32-8048S070 with ESP-IDF and Bluetooth
default_envs = crowpanel_advance_16mb
boards_dir = boards
lib_dir = libraries
src_dir = src

;===========================================
; CrowPanel Advance 7" (16MB Flash) Environment
;===========================================
[env:crowpanel_advance_16mb]
platform = espressif32@6.9.0
board = esp32-8048s070-16mb
framework = espidf

; Pre-build script to set PROJECT_VER from version.h
extra_scripts = pre:scripts/set_version.py

; Board configuration for ESP32-S3 with PSRAM and 16MB flash
board_build.flash_mode = qio
board_build.partitions = partitions/16MB_app.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; ESP-IDF specific build flags with CrowPanel Advance support
build_flags =
    -DBOARD_HAS_PSRAM
    -DSCREEN_WIDTH=800
    -DSCREEN_HEIGHT=480
    -DESP32_8048S070_ESPIDF=1
    -DCROWPANEL_ADVANCE=1
    -DLV_CONF_PATH="${PROJECT_SRC_DIR}/lv_conf.h"
    -DEEZ_PLATFORM_ESP32
    -DEEZ_FOR_LVGL
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Os
    -Wl,--gc-sections
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BTDM_CTRL_MODE_BLE_ONLY=1
    -DCONFIG_BT_BLE_ENABLED=1
    -DGITHUB_REPO=\"wokka1/hd2_macropad\"

; ESP-IDF sdkconfig file specification
board_build.esp-idf.sdkconfig_path = sdkconfig.defaults

; Upload settings
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build source filter - include ESP-IDF specific files, exclude old QSPI driver
build_src_filter =
	+<*>
	+<ble/>
	+<usb/>
	-<*.cpp>
	-<esp_lcd_axs15231b.c>
	-<esp_lcd_touch.c>
	-<lv_port.c>
